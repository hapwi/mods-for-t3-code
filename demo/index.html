<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Mods for T3 Code — integration fixture</title>
<style>body{margin:0;background:#202027;color:#e9e9ee;font:14px system-ui;display:flex;min-height:100vh}aside{width:230px;padding:22px;border-right:1px solid #3a3a46;display:flex;flex-direction:column;gap:20px}[data-slot=sidebar-inset],[data-slot=sidebar-inset]>div{flex:1;display:flex;min-width:0}main{max-width:740px;margin:auto;padding:40px}button{font:inherit;background:#393847;border:0;color:inherit;padding:10px;border-radius:6px;cursor:pointer}ul{list-style:none;padding:0}footer{margin-top:auto}p{color:#aaaab5;line-height:1.6}[data-chat-composer-stack]{margin-top:30px}[data-chat-composer-surface]{position:relative;background:#26262f;border:1px solid #555;border-radius:20px;padding:15px}[contenteditable]{min-height:80px;outline:none}</style></head>
<body><aside><strong>T3 Code fixture</strong><div data-sidebar="content"><ul data-sidebar="menu"><li><button onclick="history.pushState({},'', '/settings/appearance')">Appearance settings</button></li></ul></div><footer data-sidebar="footer"><ul data-sidebar="menu"><li>Settings</li></ul></footer></aside>
<div data-slot="sidebar-inset"><div><main><h1>A small mod, inside your app.</h1><p>This is a focused integration fixture with T3’s sidebar and composer selectors and its relevant CSP. It uses the actual mod host, manager, worker sandbox, and installation flow. Context measurements here are simulated.</p><button id="sample">Review focus timer</button> <button id="prompts">Review prompt kit</button> <button id="turn">Simulate a measured turn</button><div data-chat-composer-stack="true"><form data-chat-composer-form="true" onsubmit="event.preventDefault()"><div data-chat-composer-surface="true"><div data-testid="composer-editor" contenteditable="true" role="textbox" aria-label="T3 draft"></div></div></form></div></main></div></div>
<script>
// Fixture-only telemetry with the same shape as payload/telemetry-preload.cjs.
// __test lets the demo and browser smoke inject measurements; the app never has it.
(() => {
  const snapshots = new Map(); const listeners = new Set();
  const threadOf = (pathname) => { const segments = String(pathname).split("/").filter(Boolean); return !segments.length || ["settings", "draft"].includes(segments[0]) ? null : decodeURIComponent(segments.at(-1)); };
  window.__T3_MODS_TELEMETRY__ = Object.freeze({
    get(pathname = location.pathname) { const id = threadOf(pathname); const value = id && snapshots.get(id); return value ? { ...value } : null; },
    subscribe(listener) { listeners.add(listener); return () => listeners.delete(listener); },
    __test: Object.freeze({
      emit(snapshot) {
        const value = { turnId: null, maxTokens: null, measuredAt: Date.now(), complete: false, ...snapshot };
        snapshots.set(value.threadId, value);
        for (const listener of [...listeners]) { listener({ name: "session.usage", value: { ...value } }); if (value.complete) listener({ name: "turn.complete", value: { ...value } }); }
      },
      reset() { snapshots.clear(); },
    }),
  });
  let turn = 0; let used = 12000;
  document.getElementById("turn").onclick = () => {
    if (!threadOf(location.pathname)) history.pushState({}, "", "/local/demo-thread");
    used = Math.min(200000, used + 9000 + Math.floor(Math.random() * 30000));
    window.__T3_MODS_TELEMETRY__.__test.emit({ threadId: threadOf(location.pathname), turnId: `demo-turn-${++turn}`, usedTokens: used, maxTokens: 200000, complete: true });
  };
})();
window.__MODS_FOR_T3_OPTIONS__={inbox:'/tmp/mods-for-t3-code/inbox'};document.querySelector('[contenteditable]').addEventListener('paste',event=>{event.preventDefault();document.execCommand('insertText',false,event.clipboardData.getData('text/plain'));});document.getElementById('sample').onclick=async()=>window.__modsForT3Code.importCandidate(await(await fetch('/focus-timer.t3mod')).json());document.getElementById('prompts').onclick=async()=>window.__modsForT3Code.importCandidate(await(await fetch('/prompt-kit.t3mod')).json());if(location.search.includes('smoke')){const script=document.createElement('script');script.src='/smoke.js';document.body.append(script);}</script><script src="/renderer.js"></script></body></html>
